<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .reg-box {
            background: white;
            padding: 30px;
            width: 380px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .reg-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

<div class="reg-box">
    <h2>Create Account</h2>

    <form action="register" method="post"> <!-- RegisterServlet -->

        <input type="text" name="name" placeholder="Enter Full Name" required>

        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="password" name="password" placeholder="Create Password" required>

        <button type="submit">Register</button>

        <div class="login-link">
            <p>Already have an account? <a href="login.jsp">Login</a></p>
        </div>

    </form>
</div>

</body>
</html>
